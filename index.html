
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistic Media Display</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #110505;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            color: #2f6e7e;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.8em;
            color: #4b0082;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        img {
            border: 5px solid #6a5acd;
            border-radius: 10px;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        audio, video {
            margin: 20px;
            border: 2px solid #6a5acd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 320px; /* Consistent width for audio and video */
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: rgb(215, 189, 189);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #402d2d;
        }

        /* Responsive Styles */
        @media (max-width: 600px) {
            img, audio, video {
                width: 100%;
                max-width: 300px; /* Responsive max width */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Indian_ArtMate</h1>

        <h2>Images</h2>
        <img src="images/image.jpg" alt="Example Image" width="300">

        <h2>Audio</h2>
        <audio controls>
            <source src="audio/audio.mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>

        <h2>Video</h2>
        <video controls>
            <source src="video/video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <footer>
        <p>&copy; 2024 Artistic Media Display. All Rights Reserved.</p>
    </footer>
</body>
</html>
